<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Техреалит — фасадные системы</title>
  <script>
    // SPA-redirect для GitHub Pages: /tehrealit/xxx -> /tehrealit/?/xxx
    var keep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname +
      (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
